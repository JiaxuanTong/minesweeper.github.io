<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>minesweeper</title>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="homepage.css">
    <link rel="stylesheet" href="cells.css">
    <link rel="stylesheet" href="hiddenCells.css">
    <link rel="stylesheet" href="flaggedCells.css">
    <link rel="stylesheet" href="mineCells.css">
    <link rel="stylesheet" href="revealedCells.css">
    <link rel="stylesheet" type="text/css" media="screen and (max-device-width: 580px)" href="mobile.css" >
    <meta name="viewport" content="width=device-width, initial-scale=0.8">
</head>
<body>
<button class="music-button" id="musicButton" aria-label="Play music" title="Play music"></button>
<audio id="bgm" loop preload="auto">
    <source src="music/JRPG_Keys.mp3" type="audio/mpeg">
</audio>

<h1>MINESWEEPER</h1>
<p>Select a difficulty level:</p>
<div class="menu">
    <a href="easy.html"><div class="button" data-size="8x10x10">Easy</div></a>
    <a href="medium.html"><div class="active-button" data-size="14x18x40">Medium</div></a>
</div>
<div class="status-bar">
<!--    Moves:<span class="moveCount">0</span>-->
    Mines: <span class="mines">40</span>
    Time: <span class="timer"><time>00:00:00</time></span>

</div>

<div class="popup">
    <div class="popup-content">
        <span class="status"></span>
        <br>
        <span class="message">sld</span>
    </div>
    <a href="index.html"><span class="button">New game</span></a>
</div>

<script
        src="https://code.jquery.com/jquery-3.5.1.min.js"
        integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0="
        crossOrigin="anonymous"></script>
<script src="main.js" data-rows=14 data-cols=18 data-mines=40></script>
<script src="music.js"></script>

</body>
</html>
